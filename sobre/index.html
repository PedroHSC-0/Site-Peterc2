<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre - Pigpenfan</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
  <link rel="preload" as="image" href="../assets/imagens/background/background-1.webp">
  <link rel="icon" type="image/webp" href="../assets/imagens/icones/peterc2-icon.webp">
</head>

<body class="page-sobre">
  <div id="page-bg-overlay"></div>

  <!-- ===================== BARRA SUPERIOR DE NAVEGAÇÃO ===================== -->
  <header class="top-nav">
    <div class="top-nav-container">
      <!-- Renderizado dinamicamente via render-engine.js -->
    </div>
  </header>

  <main class="center">

    <!-- ===================== FOTOS DOS ARTISTAS ===================== -->
    <section class="collab-section about-artists-section" style="width: 100%; max-width: 900px; margin-top: 25px;">
      <div class="artist-gallery" id="about-artists-gallery">
        <!-- Renderizado dinamicamente via render-engine.js a partir de SITE_DATA.artists -->
      </div>
    </section>

    <!-- ===================== TEXTO SECO (SOBRE O PROJETO) ===================== -->
    <section class="collab-section about-text-section">
      <div class="about-text-container" id="about-text-container">
        <!-- Renderizado dinamicamente via render-engine.js a partir de SITE_DATA.aboutText -->
      </div>
    </section>

    <!-- ===================== SEÇÃO DE GALERIA / CAROUSEL DE IMAGENS ===================== -->
    <section class="collab-section about-gallery-section" id="about-gallery-section" style="width: 100%; max-width: 900px; margin-top: 35px; margin-bottom: 60px;">
      <div class="gallery-carousel-container" id="about-gallery-carousel-wrapper">
        <!-- Renderizado dinamicamente via render-engine.js a partir de SITE_DATA.aboutGallery -->
      </div>
    </section>

  </main>

  <!-- ===================== MODAL DE VISUALIZAÇÃO AMPLIADA (LIGHTBOX) ===================== -->
  <div id="image-lightbox-modal" class="image-lightbox-modal" aria-hidden="true" style="display: none;">
    <div class="lightbox-backdrop" onclick="window.SiteEngine.closeImageLightbox()" title="Clique para fechar"></div>
    <div class="lightbox-container" role="dialog" aria-modal="true" aria-label="Visualizador de Imagem">
      <button type="button" class="lightbox-close-btn" onclick="window.SiteEngine.closeImageLightbox()" title="Fechar (Esc)">✕</button>
      <button type="button" class="lightbox-nav-btn lightbox-prev-btn" onclick="window.SiteEngine.prevLightboxImage()" title="Anterior (←)">‹</button>
      <div class="lightbox-stage">
        <img id="lightbox-full-image" src="" alt="Imagem ampliada" class="lightbox-image">
        <div class="lightbox-info">
          <div id="lightbox-counter" class="lightbox-counter"></div>
        </div>
      </div>
      <button type="button" class="lightbox-nav-btn lightbox-next-btn" onclick="window.SiteEngine.nextLightboxImage()" title="Próximo (→)">›</button>
    </div>
  </div>

  <script src="../assets/js/site-data.js"></script>
  <script src="../assets/js/render-engine.js"></script>
  <script src="../assets/js/analytics.js"></script>
</body>
</html>
