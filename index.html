<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pigpenfan</title>

  <!-- Metatags Gerais e SEO -->
  <meta name="description" content="Coletivo musical independente Pigpenfan. Catálogo de álbuns, singles, vídeos, letras, fotos de shows e produtos oficiais.">
  <meta name="author" content="Pigpenfan">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph / Redes Sociais (WhatsApp, Discord, Facebook, Instagram) -->
  <meta property="og:site_name" content="Pigpenfan">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pigpenfan">
  <meta property="og:description" content="Catálogo independente, discografia completa, vídeos, letras e projetos de Peterc2, Littering, JC Dive e Pietrawrr.">
  <meta property="og:image" content="assets/imagens/capas/the-rescue-of-the-cosmic-metaphysical-engineers-cover.webp">
  <meta property="og:image:alt" content="Pigpenfan">

  <!-- Twitter / X Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pigpenfan">
  <meta name="twitter:description" content="Catálogo independente, discografia completa, vídeos, letras e projetos de Peterc2, Littering, JC Dive e Pietrawrr.">
  <meta name="twitter:image" content="assets/imagens/capas/the-rescue-of-the-cosmic-metaphysical-engineers-cover.webp">

  <!-- Progressive Web App (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/imagens/icones/pwa-icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pigpenfan">

  <!-- Estilos e Recursos -->
  <link rel="stylesheet" href="assets/css/style.css?v=8">
  <link rel="preload" as="image" href="assets/imagens/background/background-1.webp" fetchpriority="high">
  <link rel="icon" type="image/webp" href="assets/imagens/icones/peterc2-icon.webp">
</head>

<body class="home" data-page="home">
  <div id="page-bg-overlay"></div>

  <!-- ===================== BARRA SUPERIOR DE NAVEGAÇÃO ===================== -->
  <header class="top-nav">
    <div class="top-nav-container">
      <!-- Renderizado dinamicamente via render-engine.js -->
    </div>
  </header>

  <div class="center">

    <!-- ===================== SEÇÃO DE VÍDEOS EM DESTAQUE (NO TOPO) ===================== -->
    <section id="featured-videos-section" class="collab-section" style="width: 100%; max-width: 900px; display: none; margin-top: 10px;">
      <!-- Renderizado dinamicamente via render-engine.js -->
    </section>

    <!-- ===================== SEÇÃO DE LANÇAMENTOS RECENTES & FUTUROS ===================== -->
    <section id="recent-releases-section" class="collab-section" style="width: 100%; max-width: 900px; display: none;">
      <h2 class="collab-title">Lançamentos</h2>
      <div class="album-gallery" id="recent-releases-gallery">
        <!-- Renderizado dinamicamente via render-engine.js -->
      </div>
    </section>

    <h1 style="margin-top: 20px;">ARTISTAS E PROJETOS</h1>

    <!-- ===================== GRADE DE IMAGENS DOS ARTISTAS ===================== -->
    <div class="artist-gallery" id="home-artists-gallery">
      <!-- Renderizado dinamicamente via render-engine.js a partir de SITE_DATA.artists -->
    </div>

    <!-- ===================== SEÇÃO DE COLABORAÇÕES (ORDENADA POR DATA DE LANÇAMENTO) ===================== -->
    <section class="collab-section" style="width: 100%; max-width: 900px;">
      <h2 class="collab-title">Colaborações</h2>
      <div class="album-gallery" id="collab-albums-gallery">
        <!-- Renderizado dinamicamente via render-engine.js a partir de SITE_DATA.albums -->
      </div>
    </section>

    <!-- ===================== SEÇÃO DE MERCH / PRODUTOS (CAROUSEL) ===================== -->
    <section id="merch" class="collab-section merch-section" style="width: 100%; max-width: 900px; margin-top: 35px;">
      <h2 class="collab-title">Merch</h2>
      <p class="merch-notice">Em Breve</p>
      <div id="merch-carousel-wrapper" style="display: none;"></div>
    </section>

    <!-- ===================== SEÇÃO DE CONTATOS TRADICIONAL ===================== -->
    <section id="contato" class="contacts-section">
      <h2 class="contacts-header">CONTATOS E REDES SOCIAIS</h2>
      <div id="home-contacts-container">
        <!-- Renderizado dinamicamente via render-engine.js a partir de SITE_DATA.artists -->
      </div>
    </section>

  </div>

  <script src="assets/js/site-data.js"></script>
  <script src="assets/js/render-engine.js"></script>
  <script src="assets/js/analytics.js"></script>
</body>
</html>
