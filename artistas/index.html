<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artistas - Lançamentos e Contato</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=6">
  <link rel="icon" type="image/webp" href="../assets/imagens/capas/placeholder.webp">
</head>

<body>
  <div id="page-bg-overlay"></div>

  <!-- ===================== BARRA SUPERIOR DE NAVEGAÇÃO ===================== -->
  <header class="top-nav">
    <div class="top-nav-container">
      <!-- Renderizado dinamicamente via render-engine.js -->
    </div>
  </header>

  <div class="center">

    <div style="margin-top: 20px; max-width: 200px; width: 100%;">
      <img src="../assets/imagens/capas/placeholder.webp" alt="Foto do artista" class="artist-portrait" id="artist-portrait-img">
    </div>

    <h1 style="margin-top: 15px;" id="artist-name-title">—</h1>

    <!-- ===================== INTEGRANTES (SE HOUVER) ===================== -->
    <div class="members-box" id="artist-members-box" style="display: none;"></div>

    <!-- ===================== LANÇAMENTOS (ORDENADOS POR DATA) ===================== -->
    <section class="artist-projects" style="margin-top: 30px;">
      <h2 class="section-title">LANÇAMENTOS</h2>

      <div class="album-gallery" id="artist-albums-gallery">
        <!-- Renderizado dinamicamente via render-engine.js a partir de SITE_DATA.albums -->
      </div>
    </section>

    <!-- ===================== CONTATO TRADICIONAL ===================== -->
    <section id="contato" class="contacts-section">
      <h2 class="contacts-header" id="artist-contact-header">CONTATO</h2>

      <div class="contact-list" id="artist-contact-list">
        <!-- Renderizado dinamicamente via render-engine.js a partir de SITE_DATA.artists -->
      </div>
    </section>

  </div>

  <script src="../assets/js/site-data.js"></script>
  <script src="../assets/js/render-engine.js"></script>
  <script src="../assets/js/analytics.js"></script>
</body>
</html>
