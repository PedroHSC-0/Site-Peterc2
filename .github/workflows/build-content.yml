name: Auto-Compile Site Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'
      - '!content/data.json'
      - 'assets/css/modules/**'
      - 'scripts/build.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile site data and CSS bundle
        run: |
          python scripts/build.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/site-data.js content/data.json assets/css/style.css
          git diff --staged --quiet || (git commit -m "chore: auto-compile site data and styles [skip ci]" && git push)
