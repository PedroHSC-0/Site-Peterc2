name: Auto-Compile Site Catalog

on:
  push:
    branches:
      - main
    paths:
      - 'content/projetos/**'
      - 'scripts/build.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile releases to site-data.js
        run: |
          python scripts/build.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/site-data.js content/catalog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-compile catalog from content/projetos [skip ci]" && git push)
