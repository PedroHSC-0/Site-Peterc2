# =========================================================
# CONFIGURAÇÃO DE BUILD E CACHE - NETLIFY
# =========================================================

[build]
  command = "python3 scripts/build.py"
  publish = "."

# Evita gasto de minutos de build com Pull Requests externos / branches secundárias
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

# Cabeçalhos globais de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache imutável de longo prazo para imagens (1 ano)
[[headers]]
  for = "/assets/imagens/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache imutável de longo prazo para fontes locais (1 ano)
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Folhas de estilo CSS sempre revalidadas para acompanhar o HTML
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Scripts JavaScript sempre revalidados para acompanhar o HTML
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Páginas HTML sempre verificam a versão mais recente
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service Worker sempre verifica nova versão imediatamente (sem cache preso)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Manifesto PWA
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
