<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desert Sample - EP</title>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="icon" type="image/x-icon" href="../../assets/imagens/capas/desert-sample-cover.jpeg">
</head>

<body class="desert-sample">

  <!-- ===================== BARRA SUPERIOR DE NAVEGAÇÃO ===================== -->
  <header class="top-nav">
    <div class="top-nav-container">
      <span class="top-nav-logo">PIGPENFAN</span>
      <nav class="top-nav-links">
        <a href="../../index.html">INÍCIO</a>
        <a href="../../artistas/peterc2/index.html">PETERC2</a>
        <a href="../../artistas/jcdive/index.html">JC DIVE</a>
        <a href="../../artistas/littering/index.html">LITTERING</a>
        <a href="../../index.html#contato" class="nav-contact-btn">CONTATO</a>
      </nav>
    </div>
  </header>

<main class="center">

  <a href="../../index.html" class="back">← voltar ao início</a>

  <!-- ===================== PAINEL DO ÁLBUM & TRACKLIST ===================== -->
  <div class="album-detail-container">
    <img src="../../assets/imagens/capas/desert-sample-cover.jpeg" alt="Desert Sample" class="album-detail-cover">

    <div class="album-detail-info">
      <h1 class="album-detail-title">Desert Sample</h1>
      <p class="album-detail-sub">PETERC2 e JC DIVE</p>
      <p class="small-text">LANÇAMENTO: 13/03/2026</p>

      <!-- PLATAFORMAS DE STREAMING -->
      <div class="platform-icons" style="margin-top: 15px; margin-bottom: 20px;">
        <a href="https://youtu.be/GMJ9MhhTVsw" target="_blank" title="Ouvir no YouTube">
          <img src="../../assets/imagens/icones/youtube.svg" alt="YouTube">
        </a>
        <a href="https://open.spotify.com/intl-pt/album/6e4YM0KzxqGHjwpnneDjBG" target="_blank" title="Ouvir no Spotify">
          <img src="../../assets/imagens/icones/spotify.svg" alt="Spotify">
        </a>
        <a href="https://music.apple.com/br/album/desert-sample-ep/1889619290" target="_blank" title="Ouvir na Apple Music">
          <img src="../../assets/imagens/icones/apple.svg" alt="Apple Music">
        </a>
        <a href="https://peterc2.bandcamp.com/" target="_blank" title="Ouvir no Bandcamp">
          <img src="../../assets/imagens/icones/bandcamp.svg" alt="Bandcamp">
        </a>
      </div>

      <!-- FAIXAS / TRACKLIST DINÂMICA DEDUZIDA DE TRACKS.JS -->
      <div class="album-tracklist-box">
        <h2 class="album-tracklist-title">FAIXAS DO EP</h2>

        <div class="tracklist-table" id="tracklist-table">
          <!-- Gerado automaticamente a partir de musicas/tracks.js -->
        </div>
      </div>

    </div>
  </div>

</main>

  <script src="musicas/tracks.js"></script>
  <script src="../../assets/js/site-data.js"></script>
  <script src="../../assets/js/analytics.js"></script>
  <script>
    (function renderDynamicTracklist() {
      const container = document.getElementById('tracklist-table');
      if (!container || typeof TRACKS === 'undefined') return;

      container.innerHTML = TRACKS.map((track, i) => {
        const num = String(i + 1).padStart(2, '0');
        const actionText = track.youtube ? 'OUVIR ▶' : 'VER LETRA ▶';
        return `
          <a href="musicas/index.html?track=${track.slug}" class="track-row">
            <span class="track-num">${num}</span>
            <span class="track-title">${track.title}</span>
            <span class="track-action">${actionText}</span>
          </a>
        `;
      }).join('');
    })();
  </script>
</body>
</html>
