<main class="center">

  <a href="../index.html" class="back">← voltar ao álbum</a>

  </div>

</main>

<script src="tracks.js"></script>
<script>
  function render(slug) {
    const idx = TRACKS.findIndex(t => t.slug === slug);
    const track = TRACKS[idx === -1 ? 0 : idx];

    document.title = track.title + " - The Rescue Of The Metaphysical Engineers";
    document.getElementById('track-title').textContent = track.title;
    document.getElementById('track-artist').textContent = track.artist;
    document.getElementById('track-lyrics').textContent = track.lyrics ? track.lyrics.trim() : '';

    const video = document.getElementById('track-video');
    if (track.youtube) {
      video.src = 'https://www.youtube.com/embed/' + track.youtube;
      video.title = track.title;
      video.parentElement.parentElement.style.display = 'flex';
    } else {
      video.parentElement.parentElement.style.display = 'none';
    }

    const prev = TRACKS[(idx - 1 + TRACKS.length) % TRACKS.length];
    const next = TRACKS[(idx + 1) % TRACKS.length];
    document.getElementById('track-prev').href = '?track=' + prev.slug;
    document.getElementById('track-next').href = '?track=' + next.slug;

    history.replaceState(null, '', '?track=' + track.slug);
    window.scrollTo(0, 0);
  }

  const params = new URLSearchParams(location.search);
  render(params.get('track'));
</script>

</body>
